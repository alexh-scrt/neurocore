project:
  name: "local-ollama-agent"
  version: "0.1.0"

llm:
  provider: ollama
  model: "llama3.2"
  base_url: "http://localhost:11434/v1"   # overridden to http://ollama:11434/v1 in compose

paths:
  skills: "skills"
  blueprints: "blueprints"
  data: "data"
  logs: "logs"

logging:
  level: "INFO"
  format: "console"

persistence:
  enabled: true
  backend: "sqlite"

skills: {}
