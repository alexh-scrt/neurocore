# neurocore.yaml — project configuration
project:
  name: "{{ project_name }}"
  version: "0.1.0"

# LLM configuration (shared across all skills with requires_llm=True)
llm:
  provider: ""          # anthropic | openai | openai-compatible | ollama | vllm | litellm | gemini | mock
  model: ""
  api_key: ""           # or set NEUROCORE_LLM__API_KEY env var
  api_key_env: ""       # name of env var holding the key (e.g. OLLAMA_API_KEY)
  base_url: ""          # endpoint for openai-compatible/ollama/vllm (e.g. http://localhost:11434/v1)

# Paths (relative to project root, resolved at load time)
paths:
  skills: "skills"
  blueprints: "blueprints"
  data: "data"
  logs: "logs"

# Logging
logging:
  level: "INFO"
  format: "console"
  file: null

# Skill configuration (passed to skills at init)
skills: {}
