# {{ project_name }} — multi-agent debate
project:
  name: "{{ project_name }}"
  version: "0.1.0"

llm:
  provider: "anthropic"      # or openai | ollama | openai-compatible
  model: "claude-sonnet-4-6"
  api_key_env: "ANTHROPIC_API_KEY"

paths:
  skills: "skills"
  blueprints: "blueprints"
  data: "data"
  logs: "logs"

logging:
  level: "INFO"
  format: "console"

persistence:
  enabled: true
  backend: "sqlite"

skills: {}
