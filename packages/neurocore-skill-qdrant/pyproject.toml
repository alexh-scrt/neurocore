[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-qdrant"
version = "0.1.0"
description = "NeuroCore skill for vector search and upsert via Qdrant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "NeuroCore Contributors" }]
keywords = ["neurocore", "skill", "qdrant", "vector-search", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "neurocore-ai>=0.2.0",
    "qdrant-client>=1.9",
]

[project.entry-points."neurocore.skills"]
qdrant = "neurocore_skill_qdrant:QdrantSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_qdrant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
