[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-unpaywall"
version = "0.1.0"
description = "NeuroCore skill for fetching open-access PDF URLs via the Unpaywall API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "NeuroCore Contributors" }]
keywords = ["neurocore", "skill", "unpaywall", "open-access", "doi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "neurocore-ai>=0.2.0",
    "httpx>=0.27",
]

[project.entry-points."neurocore.skills"]
unpaywall = "neurocore_skill_unpaywall:UnpaywallSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_unpaywall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
