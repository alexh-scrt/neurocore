[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-base"
version = "0.1.0"
description = "Shared utilities for NeuroCore research skills"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_base"]
