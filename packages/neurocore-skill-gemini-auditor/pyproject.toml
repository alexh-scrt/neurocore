[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-gemini-auditor"
version = "0.1.0"
description = "Gemini-powered reproducibility auditor for AC1-LLM adversarial review"
requires-python = ">=3.13"
dependencies = ["neurocore-ai>=0.2.0", "google-genai>=1.0"]

[project.entry-points."neurocore.skills"]
gemini-auditor = "neurocore_skill_gemini_auditor:GeminiAuditorSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_gemini_auditor"]
