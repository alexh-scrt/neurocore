[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-semantic-scholar"
version = "0.1.0"
description = "Semantic Scholar paper search skill for NeuroCore"
requires-python = ">=3.13"
dependencies = ["neurocore-ai>=0.2.0", "httpx>=0.27"]

[project.entry-points."neurocore.skills"]
semantic-scholar = "neurocore_skill_semantic_scholar:SemanticScholarSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_semantic_scholar"]
