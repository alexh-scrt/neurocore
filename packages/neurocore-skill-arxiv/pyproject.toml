[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-arxiv"
version = "0.1.0"
description = "ArXiv search and PDF download skill for NeuroCore"
requires-python = ">=3.13"
dependencies = ["neurocore-ai>=0.2.0", "arxiv>=2.1.0"]

[project.entry-points."neurocore.skills"]
arxiv = "neurocore_skill_arxiv:ArxivSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_arxiv"]
