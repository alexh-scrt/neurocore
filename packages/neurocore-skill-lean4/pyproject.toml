[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-lean4"
version = "0.1.0"
description = "NeuroCore skill for verifying Lean 4 proof sources"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "NeuroCore Contributors" }]
keywords = ["neurocore", "skill", "lean4", "theorem-proving", "formal-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "neurocore-ai>=0.2.0",
]

[project.entry-points."neurocore.skills"]
lean4 = "neurocore_skill_lean4:Lean4Skill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_lean4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
