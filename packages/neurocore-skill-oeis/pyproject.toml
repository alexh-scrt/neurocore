[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-oeis"
version = "0.1.0"
description = "NeuroCore skill for querying the On-Line Encyclopedia of Integer Sequences (OEIS)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "NeuroCore Contributors" }]
keywords = ["neurocore", "skill", "oeis", "mathematics", "integer-sequences"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "neurocore-ai>=0.2.0",
    "httpx>=0.27",
]

[project.entry-points."neurocore.skills"]
oeis = "neurocore_skill_oeis:OEISSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_oeis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
