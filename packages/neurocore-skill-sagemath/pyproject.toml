[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocore-skill-sagemath"
version = "0.1.0"
description = "NeuroCore skill for executing SageMath code via the sage binary"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "NeuroCore Contributors" }]
keywords = ["neurocore", "skill", "sagemath", "mathematics", "computer-algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "neurocore-ai>=0.2.0",
]

[project.entry-points."neurocore.skills"]
sagemath = "neurocore_skill_sagemath:SageMathSkill"

[tool.hatch.build.targets.wheel]
packages = ["src/neurocore_skill_sagemath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
